# RGB underglow off at boot. It is the single biggest battery drain on this
# board -- an order of magnitude more than the keyboard itself -- and the
# previous "off" state lived only in stored settings, so a settings_reset
# silently turned it back on and flattened the cells again.
# The SYSTEM layer still toggles it on if you want it -- hold D + W + CMD for
# 750ms, then the second key of the bottom row.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Deep sleep settings -- worth enabling once connectivity is stable, but it
# adds a wake delay, so not while debugging dropouts.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable mouse emulation.
# CONFIG_ZMK_POINTING=y

# Change idle settings
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Custom keyboard name (max. 16 characters)
# CONFIG_ZMK_KEYBOARD_NAME="My Keyboard"
